# OPS-03: replaces the old cestaky-ingress at cutover (MIG-04 step 14). Same
# name, class and /cestaky prefix rewrite; the host nginx stays unchanged.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cestaky-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
spec:
  ingressClassName: public
  rules:
    - http:
        paths:
          - path: /cestaky/?(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: cestaky-leaves-service
                port:
                  number: 80
