# OPS-03: Leaves app (NestJS API + SPA). Config from ConfigMap
# cestaky-leaves-config (config.yml), secrets by secretKeyRef from Secret
# cestaky-leaves-secrets (created by hand, see secrets.example.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cestaky-leaves-deployment
  labels:
    app: cestaky-leaves
  annotations:
    # Triggered by the registry webhook; polling is a fallback.
    keel.sh/policy: force
    keel.sh/match-tag: 'true'
    keel.sh/trigger: poll
    keel.sh/pollSchedule: '@every 10m'
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: cestaky-leaves
  template:
    metadata:
      labels:
        app: cestaky-leaves
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      imagePullSecrets:
        - name: instea-registry
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cestaky-leaves
          image: registry.instea.co/cestaky-leaves:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 4100
          envFrom:
            - configMapRef:
                name: cestaky-leaves-config
          # NFR-05: every secret by explicit secretKeyRef (a missing key fails
          # the pod start instead of booting without it).
          env:
            - name: MONGO_URL
              valueFrom:
                secretKeyRef:
                  name: cestaky-leaves-secrets
                  key: MONGO_URL
            - name: JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: cestaky-leaves-secrets
                  key: JWT_ACCESS_SECRET
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: cestaky-leaves-secrets
                  key: SMTP_USER
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cestaky-leaves-secrets
                  key: SMTP_PASSWORD
            - name: M2M_USERNAME
              valueFrom:
                secretKeyRef:
                  name: cestaky-leaves-secrets
                  key: M2M_USERNAME
            - name: M2M_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cestaky-leaves-secrets
                  key: M2M_PASSWORD
            - name: SSO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: cestaky-leaves-secrets
                  key: SSO_USERNAME
            - name: SSO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cestaky-leaves-secrets
                  key: SSO_PASSWORD
          # OPS-01: readiness pings MongoDB; liveness only checks the socket
          # (DB loss makes the process exit instead).
          readinessProbe:
            httpGet:
              path: /health-check
              port: 4100
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 4100
            initialDelaySeconds: 30
            periodSeconds: 20
          securityContext:
            runAsNonRoot: true
            # uid/gid of the image's `node` user (numeric, so k8s can verify
            # runAsNonRoot).
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi

---
apiVersion: v1
kind: Service
metadata:
  name: cestaky-leaves-service
  labels:
    app: cestaky-leaves
spec:
  selector:
    app: cestaky-leaves
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 4100
