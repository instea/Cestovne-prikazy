# Preview (deploy/PREVIEW.md): https://cestaky2.instea.co next to the old
# app. Same pattern as the old cestaky-ingress: the host nginx block of
# cestaky2.instea.co proxies to the ingress controller under /cestaky2/ and
# this rule strips the prefix. Own name, so it never replaces the old app's
# Ingress (cestaky-ingress, replaced only at cutover by ingress.yml).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cestaky2-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
spec:
  ingressClassName: public
  rules:
    - http:
        paths:
          - path: /cestaky2/?(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: cestaky2-service
                port:
                  number: 80
