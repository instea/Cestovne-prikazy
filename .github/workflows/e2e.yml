# TST-03: Playwright E2E suite (Chromium) against the production image run
# with NODE_ENV=test and the fake Google verifier, MongoDB 8, Mailpit and an
# SSO mock (e2e/docker-compose.yml). One retry; a test that passes only on
# the retry is listed as flaky in the job summary. The HTML report and the
# traces / videos (recorded on the first retry) are uploaded when a test
# failed or was flaky. Runs only from ci.yml (NFR-09, required check
# `e2e / e2e`) or by hand; it has no pull_request / push trigger of its own,
# so it never runs twice per PR.
name: E2E

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json # engines.node
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: cestaky-leaves:e2e
          build-args: |
            APP_VERSION=0.0.0-e2e
          cache-from: type=gha,scope=e2e-image
          cache-to: type=gha,scope=e2e-image,mode=max

      - name: Validate the E2E compose file
        run: docker compose -f e2e/docker-compose.yml config --quiet

      # e2e-stack.sh sets E2E_BASE_URL, E2E_MONGO_URL and MAILPIT_API_URL; the
      # suite refuses any database but `cestaky-e2e` (never MONGO_TEST_URL).
      - name: Start the stack and run the suite
        env:
          E2E_SKIP_BUILD: '1'
        run: pnpm e2e:stack

      - name: Summarize results (flaky = passed on retry)
        id: summary
        if: ${{ !cancelled() }}
        run: node scripts/e2e-flaky-summary.mjs e2e/reports/results.json

      - name: Upload Playwright report and traces
        if: ${{ failure() || steps.summary.outputs.flaky != '0' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14
