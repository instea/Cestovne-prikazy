# NFR-11: PRs are squash-merged, so the PR title becomes the commit on
# master that release-please reads. It must be a Conventional Commit
# (types of @commitlint/config-conventional). NFR-09 required check
# `commitlint`. Kept out of ci.yml on purpose: it must re-run when the title
# is edited (`edited`), and an `edited` trigger on ci.yml would re-run (and
# cancel) the whole pipeline on every title or description edit. ci.yml has
# no title check, so nothing runs twice.
name: PR title

on:
  pull_request:
    branches:
      - master
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

concurrency:
  group: pr-title-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: commitlint
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            style
            test
          requireScope: false
