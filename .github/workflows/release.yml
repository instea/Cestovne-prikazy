# NFR-11: semantic versioning with release-please (manifest mode, one
# version for the monorepo in the root package.json, Conventional Commits).
# - Pull request: build the image only (no push).
# - Push to master: release-please opens / updates the release PR (version
#   bump + CHANGELOG.md). Every push also pushes `latest` and `sha-<7>`, so
#   Keel deploys on every merge. When the merged commit is the release PR,
#   release-please creates tag vX.Y.Z and the GitHub release, and the image
#   is also tagged X.Y.Z and X.Y.
# Releases and tags are never deleted or recreated.
name: Release

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

# Master pushes run one at a time in merge order (a newer pending run
# replaces an older pending one), so an older build can never overwrite
# `latest` after a newer one. Superseded pull-request runs are cancelled.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-please:
    name: Release PR / GitHub release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  docker:
    name: Build & push cestaky-leaves image
    needs: release-please
    # Runs for pull requests (release-please skipped) and for every push,
    # even when release-please fails (e.g. the repo setting that allows
    # Actions to create pull requests is off): then only `latest` and
    # `sha-<7>` are pushed, so Keel still deploys the merge.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute version and tags
        id: meta
        env:
          IMAGE: registry.instea.co/cestaky-leaves
          RELEASE_CREATED: ${{ needs.release-please.outputs.release_created }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
          MAJOR: ${{ needs.release-please.outputs.major }}
          MINOR: ${{ needs.release-please.outputs.minor }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_CREATED" = "true" ]; then
            version="$RELEASE_VERSION"
          else
            # Last released version (release-please bumps package.json).
            version="$(node -p "require('./package.json').version")"
          fi
          tags="$IMAGE:latest
          $IMAGE:sha-${GITHUB_SHA::7}"
          if [ "$RELEASE_CREATED" = "true" ]; then
            tags="$tags
          $IMAGE:$version
          $IMAGE:$MAJOR.$MINOR"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry.instea.co
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: registry.instea.co
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
