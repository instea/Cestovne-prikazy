name: Release

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  version:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pkg.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from package.json
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  docker:
    name: Build & push ${{ matrix.image }} image
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: cestovne-prikazy
            context: .
            dockerfile: ./Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry.instea.co
        uses: docker/login-action@v3
        with:
          registry: registry.instea.co
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            registry.instea.co/${{ matrix.image }}:latest
            registry.instea.co/${{ matrix.image }}:${{ needs.version.outputs.version }}

  release:
    name: Create GitHub release
    needs: [version, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Delete existing release and tag
        run: gh release delete "v${{ needs.version.outputs.version }}" --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
