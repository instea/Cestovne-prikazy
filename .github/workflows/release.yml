name: Release

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  # --- Code quality checks (generated by /project-setup:create-code-quality-checks) ---
  # Each job calls the repo's own scripts, so every failure reproduces locally.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ts: ${{ steps.filter.outputs.ts }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            ts:
              - '**/*.{ts,tsx,js,jsx,mjs,cjs}'
              - '**/package.json'
              - '**/yarn.lock'
              - 'eslint.config.js'
              - 'knip.json'
              - '.jscpd.json'

  ts:
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        check:
          - {
              name: lint,
              run: 'yarn lint && yarn format:check',
              angular: false,
            }
          - { name: typecheck, run: 'yarn typecheck', angular: true }
          - { name: build, run: 'yarn build:check', angular: true }
          - {
              name: static-analysis,
              run: 'yarn knip && yarn duplication',
              angular: false,
            }
    name: ts-${{ matrix.check.name }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json # engines.node
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            angular/yarn.lock
      # --ignore-scripts: bcrypt 1.0.3 (unused) can't compile on current Node; hooks aren't needed in CI.
      - run: yarn install --frozen-lockfile --ignore-scripts
      - if: matrix.check.angular
        run: yarn --cwd angular install --frozen-lockfile --ignore-scripts
      - run: ${{ matrix.check.run }}

  ts-audit:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json
          cache: yarn
      - run: yarn install --frozen-lockfile --ignore-scripts
      - run: yarn run audit
  # --- end code quality checks ---

  version:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pkg.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from package.json
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  docker:
    name: Build & push ${{ matrix.image }} image
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: cestovne-prikazy
            context: .
            dockerfile: ./Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry.instea.co
        uses: docker/login-action@v3
        with:
          registry: registry.instea.co
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            registry.instea.co/${{ matrix.image }}:latest
            registry.instea.co/${{ matrix.image }}:${{ needs.version.outputs.version }}

  release:
    name: Create GitHub release
    needs: [version, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Delete existing release and tag
        run: gh release delete "v${{ needs.version.outputs.version }}" --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
