# NFR-04: dependency and image vulnerability scanning. Fails on high +
# critical findings in production dependencies and the image, critical only
# in dev dependencies. The weekly run catches new CVEs without code changes;
# a failure notifies through GitHub's failed-workflow email.
# Accepted findings: .trivyignore.yaml (Trivy), `auditConfig.ignoreGhsas` in
# pnpm-workspace.yaml (pnpm audit), each with reason and expiry.
# PRs and pushes to master run it through ci.yml (NFR-09, job `security`:
# required checks `security / audit`, `security / dependency-review`,
# `security / image-scan`); it has no pull_request / push trigger of its own,
# so it never runs twice per PR.
name: Security

on:
  workflow_call:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# Separate groups per event, so a master push never cancels the weekly
# scheduled scan (a cancelled run sends no failure email). Only superseded
# pull-request runs are cancelled; master runs queue. When called from
# ci.yml, github.event_name is the caller's event (pull_request / push).
concurrency:
  group: security-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TRIVY_IMAGE: aquasec/trivy:0.69.3

jobs:
  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json # engines.node
          cache: pnpm

      - name: Audit production dependencies (high and critical)
        run: pnpm audit --prod --audit-level high

      - name: Audit dev dependencies (critical)
        run: pnpm audit --dev --audit-level critical

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check for deprecated production dependencies (NFR-12)
        # Fails on a deprecated direct dependency, warns on transitive ones.
        run: node scripts/check-deprecated.mjs

      - name: Lint k8s manifests and .env.example for secrets (NFR-05)
        # Secret env only by secretKeyRef, none in ConfigMaps, empty secret
        # values in .env.example (apps/api/test/ops/secrets.spec.ts).
        run: pnpm vitest run --project api-unit apps/api/test/ops

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  image-scan:
    name: image-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan repository for secrets (all severities)
        # Every secret fails, including the ones Trivy rates MEDIUM/LOW
        # (e.g. JWTs, Slack webhooks).
        run: >-
          docker run --rm -v "$PWD:/src:ro" -w /src "$TRIVY_IMAGE"
          fs --scanners secret
          --ignorefile .trivyignore.yaml
          --skip-dirs node_modules
          --exit-code 1 .

      - name: Scan Dockerfile and k8s manifests for misconfiguration
        # HIGH/CRITICAL only: the MEDIUM/LOW hardening findings on the k8s
        # manifests are reviewed by hand. .devcontainer is local tooling,
        # not shipped or deployed.
        run: >-
          docker run --rm -v "$PWD:/src:ro" -w /src "$TRIVY_IMAGE"
          fs --scanners misconfig
          --severity HIGH,CRITICAL
          --ignorefile .trivyignore.yaml
          --skip-dirs node_modules --skip-dirs .devcontainer
          --exit-code 1 .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: cestaky-leaves:scan
          build-args: |
            APP_VERSION=0.0.0-scan

      - name: Scan image for vulnerabilities
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          -v "$PWD/.trivyignore.yaml:/ignore.yaml:ro" "$TRIVY_IMAGE"
          image --severity HIGH,CRITICAL --ignore-unfixed
          --ignorefile /ignore.yaml
          --exit-code 1 cestaky-leaves:scan

      - name: Assert Node 24 in the image (NFR-12)
        run: >-
          docker run --rm --entrypoint node cestaky-leaves:scan
          -e "process.exit(process.versions.node.split('.')[0]==='24'?0:1)"

      # OPS-03 container smoke test of the scanned image (what
      # `pnpm test:image` runs locally): non-root, SPA on `/`,
      # `/health-check`, no devDependencies, run like the k8s pod.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json # engines.node
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Container smoke test (OPS-03)
        env:
          LEAVES_IMAGE: cestaky-leaves:scan
          LEAVES_IMAGE_VERSION: 0.0.0-scan
        run: pnpm vitest run --project api-integration apps/api/test/ops/image.int-spec.ts
