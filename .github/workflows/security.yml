# NFR-04: dependency and image vulnerability scanning. Fails on high +
# critical findings in production dependencies and the image, critical only
# in dev dependencies. The weekly run catches new CVEs without code changes;
# a failure notifies through GitHub's failed-workflow email.
# Accepted findings: .trivyignore.yaml (Trivy), `auditConfig.ignoreGhsas` in
# pnpm-workspace.yaml (pnpm audit), each with reason and expiry.
name: Security

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  TRIVY_IMAGE: aquasec/trivy:0.69.3

jobs:
  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Audit production dependencies (high and critical)
        run: pnpm audit --prod --audit-level high

      - name: Audit dev dependencies (critical)
        run: pnpm audit --dev --audit-level critical

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  image-scan:
    name: image-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan repository for secrets and misconfiguration
        # .devcontainer is local tooling, not shipped or deployed.
        run: >-
          docker run --rm -v "$PWD:/src:ro" -w /src "$TRIVY_IMAGE"
          fs --scanners secret,misconfig
          --severity HIGH,CRITICAL
          --ignorefile .trivyignore.yaml
          --skip-dirs node_modules --skip-dirs .devcontainer
          --exit-code 1 .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: cestaky-leaves:scan
          build-args: |
            APP_VERSION=0.0.0-scan

      - name: Scan image for vulnerabilities
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          -v "$PWD/.trivyignore.yaml:/ignore.yaml:ro" "$TRIVY_IMAGE"
          image --severity HIGH,CRITICAL --ignore-unfixed
          --ignorefile /ignore.yaml
          --exit-code 1 cestaky-leaves:scan
