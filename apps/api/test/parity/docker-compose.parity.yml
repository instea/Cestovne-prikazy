# MIG-03 attendance parity harness (profile `parity`). Started and seeded by
# `pnpm parity` (apps/api/test/parity/run.mts), which sets the variables
# below; never run against production. Old app: production image or a build
# of the old source (old-app.Dockerfile). Both apps reach the same contract
# mock for SSO and Toggl; the old app's hard-coded
# https://api.track.toggl.com resolves to the mock (network alias) and
# trusts the harness CA via NODE_EXTRA_CA_CERTS.
name: leaves-parity

x-common-env: &parity-env
  DEFAULT_TIMEZONE: ${PARITY_TIMEZONE:-Europe/Bratislava}
  M2M_USERNAME: parity-m2m
  M2M_PASSWORD: 'parity:secret'
  SSO_USERNAME: PARITY_SSO_USER
  SSO_PASSWORD: PARITY_SSO_PASSWORD

services:
  old-mongo:
    profiles: ['parity']
    image: mongo:3.6
    # Throwaway data: in memory, nothing left on disk after the run.
    tmpfs: ['/data/db', '/data/configdb', '/tmp']
    volumes:
      - ${PARITY_WORK_DIR:?run via pnpm parity}/seed:/seed:ro
    healthcheck:
      test: ['CMD', 'mongo', '--quiet', '--eval', 'db.adminCommand("ping").ok']
      interval: 2s
      timeout: 5s
      retries: 30

  new-mongo:
    profiles: ['parity']
    # Same image as the tests and the k8s StatefulSet (NFR-12).
    image: mongo:8.0@sha256:d97fea17ccb8d004cd137be8dab54d70d0df11be69c9f422aefe4484c8414ab7
    command: ['--replSet', 'rs0', '--bind_ip_all']
    tmpfs: ['/data/db', '/data/configdb', '/tmp']
    ports:
      - '127.0.0.1:${PARITY_NEW_MONGO_PORT:-14117}:27017'
    volumes:
      - ${PARITY_WORK_DIR}/seed:/seed:ro
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"
      interval: 2s
      timeout: 5s
      retries: 30

  mock:
    profiles: ['parity']
    image: node:24-slim@sha256:01d566e8d94d8c619591d78652babfccd3c6992a3dffa9ed5ab39e11cf6c70e9
    command: ['node', '/src/test/parity/mock-server.mts']
    environment:
      MOCK_CONTROL_PORT: '8000'
      MOCK_APPS: 'old:8001,new:8002,base:8003'
      MOCK_HTTPS: 'old:443'
      MOCK_TLS_KEY: /certs/server.key
      MOCK_TLS_CERT: /certs/server.crt
      MOCK_SSO_PATH: /sso
    volumes:
      # apps/api/test (mock-server.mts imports ../mocks/contract.mts).
      - ../:/src/test:ro
      - ${PARITY_WORK_DIR}/certs:/certs:ro
    ports:
      - '127.0.0.1:${PARITY_MOCK_PORT:-14100}:8000'
    networks:
      default:
        aliases: ['api.track.toggl.com']
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:8000/__health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 2s
      timeout: 5s
      retries: 30

  # One mailbox per app: the write scenarios compare the emails each sent.
  mailpit-old:
    profiles: ['parity']
    image: axllent/mailpit:v1.33.0
    environment: &mailpit-env
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
    ports:
      - '127.0.0.1:${PARITY_OLD_MAIL_PORT:-14125}:8025'

  mailpit-new:
    profiles: ['parity']
    image: axllent/mailpit:v1.33.0
    environment: *mailpit-env
    ports:
      - '127.0.0.1:${PARITY_NEW_MAIL_PORT:-14126}:8025'

  migrate:
    profiles: ['parity-migrate']
    image: ${PARITY_NEW_IMAGE:-cestaky-leaves:parity}
    command:
      ['node', 'dist/migration/migrate-legacy.js', '--report-dir', '/report']
    environment:
      NODE_ENV: production
      LEGACY_MONGO_URL: mongodb://new-mongo:27017/cestaky_legacy?directConnection=true
      MONGO_URL: mongodb://new-mongo:27017/cestaky?directConnection=true
      DEFAULT_TIMEZONE: ${PARITY_TIMEZONE:-Europe/Bratislava}
    volumes:
      - ${PARITY_WORK_DIR}/migration-report:/report

  old-app: &old-app
    profiles: ['parity']
    image: ${PARITY_OLD_IMAGE:-cestaky-old:parity}
    environment: &old-app-env
      <<: *parity-env
      MONGO_URL: mongodb://old-mongo:27017/cestaky
      SSO_URI: http://mock:8001/sso
      NODE_EXTRA_CA_CERTS: /certs/ca.crt
      # As in production (kubernetes/cestaky.yml): the email link is
      # BASE_URL + /leaves/approval.
      NODE_ENV: production
      BASE_URL: https://parity.example.test
      SMTP_HOST: mailpit-old
      SMTP_PORT: '1025'
      SMTP_SECURE: 'false'
      SMTP_USER: parity
      SMTP_PASSWORD: parity
      MAIL_SENDER: parity@example.test
      APPROVAL_MAIL_RECEIVER: approver@example.test
    volumes:
      - ${PARITY_WORK_DIR}/secrets:/opt/app/secrets:ro
      - ${PARITY_WORK_DIR}/certs:/certs:ro
    ports:
      - '127.0.0.1:${PARITY_OLD_PORT:-14101}:4100'
    depends_on:
      old-mongo: { condition: service_healthy }
      mock: { condition: service_healthy }
      mailpit-old: { condition: service_started }
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:4100/health-check', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 2s
      timeout: 5s
      retries: 60

  # Old baseline: the same old app and data, but its SSO answer (mock port
  # 8003) lacks the employees that make the old app hang or fail. Asked only
  # for the months where the old app gave no data, so the new answer of
  # every other employee is still compared (classify.mts HANG_FIX,
  # NO_TOGGL_ID_SKIPPED).
  old-base:
    <<: *old-app
    environment:
      <<: *old-app-env
      SSO_URI: http://mock:8003/sso
    ports:
      - '127.0.0.1:${PARITY_OLD_BASE_PORT:-14103}:4100'

  new-app:
    profiles: ['parity']
    image: ${PARITY_NEW_IMAGE:-cestaky-leaves:parity}
    environment:
      <<: *parity-env
      NODE_ENV: production
      PORT: '4100'
      BASE_URL: https://parity.example.test
      MONGO_URL: mongodb://new-mongo:27017/cestaky?directConnection=true
      HOSTED_DOMAIN: instea.co
      GOOGLE_CLIENT_ID: parity.apps.googleusercontent.com
      # Generated per run; the harness signs sessions with it (leave list).
      JWT_ACCESS_SECRET: ${PARITY_JWT_ACCESS_SECRET:?run via pnpm parity}
      SMTP_HOST: mailpit-new
      SMTP_PORT: '1025'
      SMTP_SECURE: 'false'
      SMTP_USER: parity
      SMTP_PASSWORD: parity
      MAIL_SENDER: parity@example.test
      APPROVAL_MAIL_RECEIVER: approver@example.test
      SSO_URI: http://mock:8002/sso
      TOGGL_REPORTS_BASE_URL: http://mock:8002/reports/api/v3
      LOG_LEVEL: warn
    ports:
      - '127.0.0.1:${PARITY_NEW_PORT:-14102}:4100'
    depends_on:
      new-mongo: { condition: service_healthy }
      mock: { condition: service_healthy }
      mailpit-new: { condition: service_started }
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:4100/health-check').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 2s
      timeout: 5s
      retries: 60
